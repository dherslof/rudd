[package]
name = "rudd"
version = "0.1.0"
edition = "2024"
authors = ["dherslof <d_herslof@hotmail.com>"]
description = "Rust Directory Delta - A CLI tool to visualize differences between directories"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
colored = "2.1"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"

[lib]
name = "rudd"
path = "src/lib.rs"

[[bin]]
name = "rudd"
path = "src/main.rs"
